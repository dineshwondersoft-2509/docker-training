<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Docker Professional Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        pre {
            background: #eee;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Docker Professional Lab</h1>

    <p>
        Frontend Container → API Container → PostgreSQL Container
    </p>

    <button onclick="testAPI()">Test API</button>

    <button onclick="testDatabase()">Test Database</button>

    <pre id="result">Waiting...</pre>

</div>

<script>

async function testAPI() {

const response =
    await fetch("/api/");

const data =
    await response.json();

document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);
}


async function testDatabase() {

const response =
    await fetch("/api/db");

const data =
    await response.json();

document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
